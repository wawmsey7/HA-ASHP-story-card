# Grant Aerona HP290: scripts that change settings on the ecoNET300 hub
# ======================================================================
# This replaces the Grant scripts in your scripts file (all six you sent me), and adds two new ones
# (night temperature and setback). Same names, same fields, same rest commands, so nothing that uses
# them needs changing. If the file has other scripts too, keep those.
#
# Each one works the same way:
#   1. send the value to the hub (your rest command),
#   2. wait 2 seconds,
#   3. ask the hub for a fresh reading, wait 2 seconds and check it, and keep doing that until the hub
#      reports the new value or about 30 seconds have passed.
#
# (The boost script stays as it was: its status can flip back as soon as the tank is hot, so waiting for it
# could leave your Hot Water card saying "Sending…" for half a minute.)
#
# Compared with the earlier versions:
#   - they ask the hub again each time round, so they finish as soon as it has the value (usually 2–4 s),
#     rather than waiting for the sensor's next 30-second poll;
#   - both sides are rounded the same way before comparing, and a reading that's briefly 'unavailable'
#     just counts as "not yet" instead of stopping the script with an error;
#   - mode: restart, so if you change a value again while one is still waiting, the latest value is
#     sent (in the default mode the second change would be ignored).

grant_set_dhw_target:
  alias: "Grant - Set DHW Target Temperature"
  description: "Sends the hot water target to the hub, then re-reads it until the hub reports it"
  mode: restart
  fields:
    value:
      description: "Target temperature in °C (35–65)"
      example: 50
      required: true
      selector:
        number:
          min: 35
          max: 65
          unit_of_measurement: "°C"
  sequence:
    - action: rest_command.grant_set_dhw_target
      data:
        value: "{{ value | int }}"
    - delay: "00:00:02"
    - repeat:
        sequence:
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.dhw_target_temp_setting
          - delay: "00:00:02"
        until:
          - condition: template
            value_template: >
              {% set s = states('sensor.dhw_target_temp_setting') %}
              {{ (s | is_number and s | float | round(0) == value | float | round(0)) or repeat.index >= 15 }}

grant_set_daytemp_target:
  alias: "Grant - Set Day Temperature"
  description: "Sends the day temperature to the hub, then re-reads it until the hub reports it"
  mode: restart
  fields:
    value:
      description: "Target temperature in °C"
      example: 22.1
      required: true
      selector:
        number:
          min: 14
          max: 25
          step: 0.1
          unit_of_measurement: "°C"
  sequence:
    - action: rest_command.grant_set_c1_comfort_temp
      data:
        value: "{{ value | float | round(1) }}"
    - delay: "00:00:02"
    - repeat:
        sequence:
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.circuit_1_comfort_day_temp
          - delay: "00:00:02"
        until:
          - condition: template
            value_template: >
              {% set s = states('sensor.circuit_1_comfort_day_temp') %}
              {{ (s | is_number and s | float | round(1) == value | float | round(1)) or repeat.index >= 15 }}

