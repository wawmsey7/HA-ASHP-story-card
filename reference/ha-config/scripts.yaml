grant_dhw_boost:
  alias: "Grant - DHW Boost"
  description: "Starts (1) or cancels (0) a one-off hot water reheat, then re-polls the status (unchanged, apart from tidying)"
  mode: restart
  fields:
    value:
      description: "1 = start boost, 0 = cancel boost"
      example: 1
      required: true
      selector:
        number:
          min: 0
          max: 1
          step: 1
  sequence:
    - action: rest_command.grant_set_dhw_boost
      data:
        value: "{{ value | int }}"
    - delay: "00:00:02"
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.dhw_boost_status
